<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Australien Reiseplan</title>
<meta name="theme-color" content="#1F3A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F5EEE3; --card:#FFFDF9; --ink:#2A221C; --muted:#7A6A5C; --line:#E6DACA;
    --deep:#1F3A3D; --ochre:#B8461F; --ochre-soft:#F6DDD0; --sun:#F6C453;
    --green:#3E7C59; --green-soft:#DCEFE3; --warn:#A15C00; --warn-soft:#FBEBCF;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  header{background:var(--deep);color:#F5EEE3;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:1.25rem;letter-spacing:.01em}
  header .sub{font-size:.9rem;opacity:.85;margin-top:2px}
  main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav button{background:none;border:0;padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
  nav button svg{width:23px;height:23px}
  nav button[aria-current="page"]{color:var(--ochre);font-weight:600}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ochre);color:#fff;font-size:.7rem;line-height:18px;text-align:center}

  .toolbar{display:flex;gap:8px;margin:4px 0 12px}
  .toolbar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .btn{border:0;border-radius:10px;padding:10px 14px;background:var(--deep);color:#fff;font-weight:600;cursor:pointer}
  .btn.secondary{background:var(--card);color:var(--deep);border:1px solid var(--line)}
  .btn.danger{background:#9B2C2C}
  .btn.block{width:100%;margin-top:8px}

  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:12px}
  .day.today{border:2px solid var(--ochre);box-shadow:0 2px 10px rgba(184,70,31,.15)}
  .day.past{opacity:.6}
  .date{text-align:center;border-right:1px solid var(--line);padding-right:10px}
  .date .wd{font-size:.75rem;text-transform:uppercase;color:var(--muted);font-weight:600}
  .date .d{font-size:1.5rem;font-weight:700;line-height:1.1}
  .date .m{font-size:.75rem;color:var(--muted)}
  .date .n{font-size:.68rem;color:var(--ochre);font-weight:600;margin-top:4px}
  .was{font-weight:600;white-space:pre-line}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{white-space:nowrap;font-size:.78rem;padding:2px 8px;border-radius:999px;background:#EFE6D8;color:#5A4A3C}
  .chip.ok{background:var(--green-soft);color:var(--green)}
  .chip.todo{background:var(--warn-soft);color:var(--warn)}
  .chip.car{background:var(--ochre-soft);color:var(--ochre)}
  a.fl{display:inline-block;vertical-align:middle;margin:2px 0 2px 4px;padding:3px 9px;border-radius:999px;background:var(--deep);color:#fff;text-decoration:none;font-size:.76rem;font-weight:600;white-space:nowrap;line-height:1.4}
  a.fl.alt{background:#fff;color:var(--deep);border:1px solid var(--line)}
  .rt{white-space:pre-line}
  /* Wetter */
  .wx-now{display:flex;align-items:center;gap:14px}
  .wx-now .ic{font-size:3rem;line-height:1}
  .wx-now .t{font-size:2.2rem;font-weight:700;line-height:1}
  .wx-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
  .wx-days div{background:#F3EDE3;border-radius:10px;padding:6px 2px;font-size:.72rem}
  .wx-days .ic{font-size:1.3rem;display:block;margin:2px 0}
  .wx-days b{display:block;font-size:.82rem}
  .wx-days .rain{color:#2F6690}
  .place{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .place:first-of-type{border-top:0}
  .place .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .place .cur{font-size:1.05rem;font-weight:700;white-space:nowrap}
  .chip.wx{background:#E4EEF5;color:#2F4F6B}
  .chip.sc{background:#EAE4F2;color:#5B4580}
  .wx-days div.sel{outline:2px solid var(--ochre);background:#FBEDE5}
  .wx-days div{cursor:pointer}
  .periods{margin-top:10px;border-top:1px solid var(--line)}
  .periods .pr{display:grid;grid-template-columns:92px 34px 1fr auto;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
  .periods .pr .ic{font-size:1.35rem}
  .periods .pr .rain{color:#2F6690;font-size:.8rem;white-space:nowrap}
  .periods h5{margin:10px 0 2px;font-size:.85rem}
  /* Sehenswürdigkeiten */
  .grp h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .grp h2 small{font-weight:400;color:var(--muted);font-size:.78rem}
  .sight{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .sight .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;padding:0;cursor:pointer;font-size:.8rem;color:#fff}
  .sight.done .chk{background:var(--green);border-color:var(--green)}
  .sight.done .nm{text-decoration:line-through;color:var(--muted)}
  .sight .nm{font-weight:600;cursor:pointer}
  .sight .ds{font-size:.86rem;color:var(--muted);white-space:pre-line}
  .sight .lk{font-size:.82rem;margin-top:3px;display:flex;gap:12px}
  .addlink{background:none;border:0;color:var(--ochre);font-weight:600;padding:8px 0 0;cursor:pointer}
  .field.check{display:flex;align-items:center;gap:8px}
  .field.check input{width:auto}
  .stay{font-size:.88rem;color:var(--muted);margin-top:6px}
  .today-label{font-size:.7rem;font-weight:700;color:var(--ochre);text-transform:uppercase;letter-spacing:.05em}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:1rem;margin:0 0 8px}
  .card p{margin:6px 0;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:1.35rem}
  .stat span{font-size:.75rem;color:var(--muted)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .l{font-weight:600}
  .row .r{color:var(--muted);font-size:.85rem;text-align:right;white-space:nowrap}
  .todo-item{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .todo-item:first-of-type{border-top:0}
  .todo-item small{color:var(--ochre);font-weight:600}
  .todo-item div{white-space:pre-line}
  .empty{text-align:center;padding:40px 12px;color:var(--muted)}
  .empty svg{width:72px;height:72px;margin-bottom:8px}

  dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:720px;margin:auto auto 0;max-height:92vh;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(20,15,10,.45)}
  .dlg-head{position:sticky;top:0;background:var(--card);padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
  .dlg-head h3{margin:0;font-size:1.05rem}
  .x{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted);padding:4px 8px;cursor:pointer}
  .dlg-body{padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .field textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .detail dt{font-size:.78rem;font-weight:600;color:var(--muted);margin-top:12px}
  .detail dd{margin:2px 0 0;white-space:pre-line}
  .actions{display:flex;gap:8px;margin-top:18px}
  .actions .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .hint{font-size:.85rem;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="title">Australien 2027</h1>
  <div class="sub" id="subtitle">Reiseplan</div>
</header>

<main id="main"></main>

<nav>
  <button data-tab="plan" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button data-tab="offen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Offen <span id="todoBadge" class="badge hidden"></span></span></button>
  <button data-tab="wetter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M2.5 8H1M3.6 3.6l1 1M12.4 3.6l-1 1"/><path d="M8 20h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 8 20z"/></svg>Wetter</button>
  <button data-tab="sehen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Sehenswert</button>
  <button data-tab="unterkunft">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Unterkünfte</button>
  <button data-tab="daten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Daten</button>
</nav>

<!-- Detail / Bearbeiten -->
<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="x" data-close aria-label="Schliessen">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<!-- Register-Auswahl beim Import -->
<dialog id="sheetDlg">
  <div class="dlg-head"><h3>Welches Register importieren?</h3><button class="x" data-close aria-label="Schliessen">×</button></div>
  <div class="dlg-body">
    <div class="field"><label for="sheetSel">Register</label><select id="sheetSel"></select></div>
    <p class="hint">Achtung: Der Import ersetzt den aktuellen Plan in der App. Exportiere vorher ein Backup, falls du unterwegs etwas geändert hast.</p>
    <div class="actions"><button class="btn secondary" data-close>Abbrechen</button><button class="btn" id="sheetOk">Importieren</button></div>
  </div>
</dialog>

<input type="file" id="fileIn" accept=".xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden">
<div class="toast" id="toast"></div>

<script src="xlsx.full.min.js"></script>
<script>
'use strict';
const KEY = 'reiseplan-v1';
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const FIELDS = [
  // key, Bezeichnung in der App, Spaltenname im Export
  ['datum','Datum','Datum'],
  ['status','Status','Status'],
  ['was','Was','Was'],
  ['fahrzeit','Fahrzeit (h:min)','Fahrt (h/min)'],
  ['km','Fahrt (km)','Fahrt (km)'],
  ['besuch','Besichtigung (h)','Bes.(h)'],
  ['mietauto','Mietauto','Miet-Auto'],
  ['bemerkungen','Unterwegs / Bemerkungen','Unterwegs / Bemerkungen'],
  ['zusatz','Weitere Infos','Weitere Infos'],
  ['pendenzen','Pendenzen','Pendenzen'],
  ['unterkunft','Unterkunft','Unterkunft'],
  ['fruehstueck','Frühstück','Breakfast'],
  ['notizen','Eigene Notizen','Notizen'],
  ['ort','Ort für Wetter (leer = automatisch)','Ort'],
];

let state = load();
let tab = 'plan';
let query = '';
let pendingWb = null;
let installEvt = null;

/* ---------- Speicher ---------- */
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.days)){ s.sights = s.sights || []; return s; } } catch(e){}
  return { title:'Australien 2027', days:[], sights:[], importedAt:null, changedAt:null };
}
function save(){
  state.changedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Speichern fehlgeschlagen – Speicher voll?'); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- Hilfsfunktionen ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function dayDiff(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtLong(iso){ if(!iso) return 'Ohne Datum'; const d=parseISO(iso); return WD[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear(); }
function sortDays(){ state.days.sort((a,b)=> (a.datum||'9999') < (b.datum||'9999') ? -1 : (a.datum||'9999') > (b.datum||'9999') ? 1 : 0); }
function firstLine(s){ return String(s||'').split('\n')[0]; }

/* ---------- Flüge: Flugnummern erkennen und Live-Status verlinken ---------- */
// Flugnummern in einer Zeile – nur wenn «Flug»/«Flight» in derselben Zeile steht
function flightCodesInLine(line){
  if (!/flug|flight/i.test(line)) return [];
  const re = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{1,4})\b/g; const out = []; let m;
  while ((m = re.exec(line))){ const c = m[1] + m[2]; if (!out.includes(c)) out.push(c); }
  return out;
}
function flightsOf(d){
  const out = [];
  ['was','bemerkungen','zusatz','pendenzen','notizen'].forEach(k => String(d[k]||'').split('\n')
    .forEach(l => flightCodesInLine(l).forEach(c => { if (!out.includes(c)) out.push(c); })));
  return out;
}
// Text mit Flugstatus-Knöpfen direkt hinter der Zeile, in der der Flug steht
function richText(text, full){
  return String(text||'').split('\n').map(line => {
    const codes = flightCodesInLine(line);
    return esc(line) + codes.map(f =>
      ` <a class="fl" href="${statusUrl(f)}" target="_blank" rel="noopener" data-stop>✈ Status ${esc(f)}</a>` +
      (full ? ` <a class="fl alt" href="${radarUrl(f)}" target="_blank" rel="noopener" data-stop>Radar</a>` : '')).join('');
  }).join('\n');
}
// Frühstück als farbiges Etikett: gebucht = grün, nein = grau, sonst (z.B. «zusätzlich») = orange
function breakfastChip(v){
  const s = String(v||'').trim(); if (!s) return '';
  const cls = /gebucht|inkl|ja\b/i.test(s) ? 'ok' : /^nein|^kein/i.test(s) ? '' : 'todo';
  return `<span class="chip ${cls}">☕ Frühstück: ${esc(s)}</span>`;
}
const statusUrl =(f) => 'https://www.google.com/search?q=' + encodeURIComponent(f + ' flight status');
const radarUrl  = (f) => 'https://www.flightradar24.com/data/flights/' + f.toLowerCase();

// Excel-Seriennummer oder Text -> JJJJ-MM-TT
function toISO(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if (m){ let y=+m[3]; if(y<100) y+=2000; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
// Fahrzeit: 2.15 -> "2:15", 3.3 -> "3:30"
function fmtDrive(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number'){
    const h = Math.floor(v); const m = Math.round((v - h) * 100);
    return h + ':' + String(m).padStart(2,'0');
  }
  return String(v).trim();
}
function driveMinutes(s){
  const m = String(s||'').match(/^(\d+)[:.,h ]\s*(\d{1,2})?/);
  if (!m) return 0;
  let min = m[2] ? +m[2] : 0; if (m[2] && m[2].length===1) min*=10;
  return (+m[1])*60 + min;
}
function clean(v){ if (v==null) return ''; const s=String(v).replace(/\r/g,'').trim(); return s==='-----'?'':s; }

/* ---------- Import ---------- */
function mapHeader(h, idx, dateIdx){
  const s = String(h ?? '').toLowerCase().trim();
  if (!s){
    if (dateIdx >= 0 && idx === dateIdx + 1) return 'status';
    return 'zusatz';
  }
  if (s.startsWith('datum')) return 'datum';
  if (s === 'status') return 'status';
  if (s.startsWith('was')) return 'was';
  if (s.startsWith('fahrt') && s.includes('km')) return 'km';
  if (s.startsWith('fahrt')) return 'fahrzeit';
  if (s.startsWith('bes')) return 'besuch';
  if (s.startsWith('miet')) return 'mietauto';
  if (s.startsWith('unterwegs') || s.startsWith('bemerk')) return 'bemerkungen';
  if (s.startsWith('weitere')) return 'zusatz';
  if (s.startsWith('pendenz')) return 'pendenzen';
  if (s.startsWith('unterkunft')) return 'unterkunft';
  if (s.startsWith('breakfast') || s.startsWith('frühst') || s.startsWith('fruehst')) return 'fruehstueck';
  if (s.startsWith('notiz')) return 'notizen';
  if (s === 'ort' || s.startsWith('ort ')) return 'ort';
  return null; // z.B. Tag, Wochentag, Total -> wird berechnet / ignoriert
}

function importSheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null, blankrows:false });
  const hi = rows.findIndex(r => r && r.some(c => String(c ?? '').toLowerCase().trim().startsWith('datum')));
  if (hi < 0) throw new Error('Keine Spalte «Datum» gefunden.');
  const head = rows[hi];
  const dateIdx = head.findIndex(c => String(c ?? '').toLowerCase().trim().startsWith('datum'));
  const width = Math.max(...rows.map(r => r ? r.length : 0));
  const map = []; for (let i=0;i<width;i++) map[i] = mapHeader(head[i], i, dateIdx);

  const days = [];
  for (const r of rows.slice(hi+1)){
    if (!r) continue;
    const d = { id:uid() }; FIELDS.forEach(([k]) => d[k] = '');
    let hasData = false;
    const extra = [];
    r.forEach((v, i) => {
      const k = map[i]; if (!k || v == null || String(v).trim()==='') return;
      hasData = true;
      if (k === 'datum') d.datum = toISO(v);
      else if (k === 'fahrzeit') d.fahrzeit = fmtDrive(v);
      else if (k === 'km' || k === 'besuch') d[k] = typeof v === 'number' ? String(Math.round(v*100)/100) : clean(v);
      else if (k === 'zusatz') extra.push(clean(v));
      else d[k] = clean(v);
    });
    if (extra.length) d.zusatz = [d.zusatz, ...extra].filter(Boolean).join('\n');
    if (!hasData) continue;
    if (d.datum){ days.push(d); continue; }
    // Zeile ohne Datum: Text (z.B. "Ankunft Mailand") an den Vortag anhängen, Summenzeilen ignorieren
    const rowText = r.map(c => String(c ?? '')).join(' ').toLowerCase();
    if (rowText.includes('anzahl') || !d.was || !isNaN(Number(d.was))) continue;
    const prev = days[days.length-1];
    if (prev) prev.was = (prev.was ? prev.was + '\n' : '') + d.was;
  }
  if (!days.length) throw new Error('Keine Tage mit Datum gefunden.');
  return days;
}

/* ---------- Export ---------- */
function buildWorkbook(){
  const header = ['Wochentag', ...FIELDS.map(f => f[2])];
  const data = [header];
  sortDays();
  state.days.forEach(d => {
    const wd = d.datum ? WD[parseISO(d.datum).getDay()] : '';
    data.push([wd, ...FIELDS.map(([k]) => {
      if (k==='datum' && d.datum){ const p=d.datum.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
      if ((k==='km'||k==='besuch') && d[k]!=='' && !isNaN(Number(d[k]))) return Number(d[k]);
      return d[k] || '';
    })]);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [6,11,9,40,10,9,8,9,40,20,20,32,10,30,16].map(w => ({ wch:w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (state.sheet || 'Reiseplan').slice(0,31));
  const sd = [SIGHT_COLS, ...state.sights.map(s => [s.wo, s.name, s.info, s.link, s.besucht ? 'ja' : ''])];
  const ws2 = XLSX.utils.aoa_to_sheet(sd);
  ws2['!cols'] = [30,30,50,40,8].map(w => ({ wch:w }));
  XLSX.utils.book_append_sheet(wb, ws2, 'Sehenswürdigkeiten');
  return wb;
}
function exportBlob(){
  const out = XLSX.write(buildWorkbook(), { bookType:'xlsx', type:'array' });
  return new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function exportName(){ return 'Reiseplan_' + todayISO() + '.xlsx'; }
function doDownload(){
  const a = document.createElement('a'); a.href = URL.createObjectURL(exportBlob()); a.download = exportName();
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  state.exportedAt = new Date().toISOString(); save(); toast('Excel-Datei gespeichert (Ordner «Downloads»)');
}

function dayCard(d, idx, first){

/* ---------- Wetter (Open-Meteo: kostenlos, ohne Schlüssel) ---------- */
const WX_KEY = 'wetter-v1';
const PLACES = [
  ['Mailand', 45.63, 8.72, /mailand|milano|malpensa/i],
  ['Brisbane', -27.47, 153.03, /brisbane|clayfield/i],
  ['Noosa', -26.39, 153.09, /noosa|tewantin/i],
  ['Hervey Bay', -25.29, 152.84, /hervey|beachside motor inn/i],
  ["K'gari", -25.24, 153.13, /k.?gari|fraser island/i],
  ['Airlie Beach (Whitsundays)', -20.27, 148.72, /proserpine|whitsunday|airlie|sunlit waters/i],
  ['Magnetic Island', -19.15, 146.85, /magnetic island/i],
  ['Townsville', -19.26, 146.82, /townsville|kissing point|qcwa/i],
  ['Cape Tribulation', -16.09, 145.46, /daintree|cape tribulation/i],
  ['Atherton', -17.27, 145.48, /atherton|altherton/i],
  ['Kuranda', -16.82, 145.64, /kuranda/i],
  ['Port Douglas', -16.48, 145.46, /port douglas/i],
  ['Cairns', -16.92, 145.77, /cairns|esplanade/i],
  ['Kings Canyon', -24.25, 131.57, /kings canyon/i],
  ['Uluru', -25.24, 130.99, /uluru|ayers|yulara|outback lodge|kata tjuta/i],
  ['Sydney', -33.87, 151.21, /sydney/i],
];
let wx = (() => { try { return JSON.parse(localStorage.getItem(WX_KEY)) || {}; } catch(e){ return {}; } })();
wx.data = wx.data || {}; wx.geo = wx.geo || {};
const wxOpen = new Set();
let wxBusy = false;
function saveWx(){ try { localStorage.setItem(WX_KEY, JSON.stringify(wx)); } catch(e){} }

// Ort eines Tages: eigenes Feld «Ort», sonst der zuletzt genannte bekannte Ort im Text, sonst die Unterkunft
function placeOf(d){
  if (d.ort){
    const g = wx.geo[d.ort.toLowerCase()];
    return { name:d.ort, lat:g && g.lat, lon:g && g.lon, custom:true };
  }
  const find = (text, skipHome) => {
    let best = null, bestPos = -1;
    PLACES.forEach(p => {
      if (skipHome && p[0] === 'Mailand') return;
      const re = new RegExp(p[3].source, 'gi'); let m;
      while ((m = re.exec(text))) if (m.index >= bestPos){ bestPos = m.index; best = p; }
    });
    return best;
  };
  let text = String(d.was || '');
  // «Abend Fahrt nach …» zählt nicht – tagsüber ist man noch am vorherigen Ort
  const ab = text.search(/\babends?\b/i);
  if (ab > 0 && find(text.slice(0, ab))) text = text.slice(0, ab);
  // am Rückreisetag zählt der Abflugort in Australien, nicht Mailand
  let best = find(text, true) || find(text);
  if (!best) best = PLACES.find(p => p[3].test(d.unterkunft || ''));
  return best ? { name:best[0], lat:best[1], lon:best[2] } : null;
}
function tripPlaces(){
  const list = [];
  state.days.forEach(d => {
    const p = placeOf(d); if (!p) return;
    let e = list.find(x => x.name === p.name);
    if (!e){ e = { ...p, days:[] }; list.push(e); }
    if (d.datum) e.days.push(d.datum);
  });
  return list;
}
const WMO = (c, day=1) => {
  if (c === 0) return [day ? '☀️' : '🌙', 'Sonnig'];
  if (c === 1) return [day ? '🌤️' : '🌙', 'Überwiegend sonnig'];
  if (c === 2) return ['⛅', 'Teilweise bewölkt'];
  if (c === 3) return ['☁️', 'Bewölkt'];
  if (c === 45 || c === 48) return ['🌫️', 'Nebel'];
  if (c >= 51 && c <= 57) return ['🌦️', 'Nieselregen'];
  if (c >= 61 && c <= 67) return ['🌧️', 'Regen'];
  if (c >= 71 && c <= 77) return ['🌨️', 'Schnee'];
  if (c >= 80 && c <= 82) return ['🌦️', 'Regenschauer'];
  if (c === 85 || c === 86) return ['🌨️', 'Schneeschauer'];
  if (c >= 95) return ['⛈️', 'Gewitter'];
  return ['🌡️', '–'];
};
// Prognose für einen Reisetag (nur wenn das Datum in der 7-Tage-Prognose liegt)
function forecastFor(d){
  const p = placeOf(d); if (!p || !d.datum) return null;
  const w = wx.data[p.name]; if (!w || !w.daily) return null;
  const i = w.daily.time.indexOf(d.datum); if (i < 0) return null;
  const [icon, label] = WMO(w.daily.weather_code[i]);
  const rain = w.daily.precipitation_probability_max ? w.daily.precipitation_probability_max[i] : null;
  return { icon, label, max:Math.round(w.daily.temperature_2m_max[i]), min:Math.round(w.daily.temperature_2m_min[i]), rain };
}
async function geocode(name){
  const key = name.toLowerCase();
  if (wx.geo[key]) return wx.geo[key];
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + encodeURIComponent(name));
  const j = await r.json(); const g = j.results && j.results[0];
  if (!g) return null;
  wx.geo[key] = { lat:g.latitude, lon:g.longitude, label:g.name + (g.country ? ', ' + g.country : '') };
  saveWx(); return wx.geo[key];
}
async function refreshWeather(force){
  if (wxBusy || !navigator.onLine) return;
  const places = tripPlaces(); if (!places.length) return;
  if (!force && wx.at && Date.now() - wx.at < 30*60*1000) return; // höchstens alle 30 Min. neu laden
  wxBusy = true; if (tab === 'wetter') renderWeather();
  let ok = 0;
  await Promise.allSettled(places.map(async p => {
    if (p.custom && p.lat == null){ const g = await geocode(p.name); if (!g) return; p.lat = g.lat; p.lon = g.lon; }
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon +
      '&current=temperature_2m,weather_code,is_day,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&hourly=temperature_2m,weather_code,precipitation_probability' +
      '&timezone=auto&forecast_days=7';
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    wx.data[p.name] = await r.json(); ok++;
  }));
  wxBusy = false;
  if (ok){ wx.at = Date.now(); saveWx(); }
  else if (force) toast('Wetter konnte nicht geladen werden');
  if (tab === 'wetter') renderWeather();
  else if (tab === 'plan' && document.activeElement && document.activeElement.id !== 'q') renderPlan();
}
function fmtRange(days){
  if (!days.length) return '';
  const a = parseISO(days[0]), b = parseISO(days[days.length-1]);
  return days.length === 1 ? a.getDate() + '. ' + MON[a.getMonth()] : a.getDate() + '.–' + b.getDate() + '. ' + MON[b.getMonth()];
}
// 7-Tage-Leiste; ein Tag ist ausgewählt und darunter nach Tageszeiten aufgeteilt
const wxSel = {};
function weekHTML(w, name){
  if (!w || !w.daily) return '';
  const sel = Math.min(wxSel[name] || 0, w.daily.time.length - 1);
  return `<div class="wx-days">${w.daily.time.map((t,i) => {
    const [ic, lb] = WMO(w.daily.weather_code[i]); const dt = parseISO(t);
    const rain = w.daily.precipitation_probability_max ? w.daily.precipitation_probability_max[i] : null;
    return `<div title="${esc(lb)}" class="${i === sel ? 'sel' : ''}" data-wxday="${i}" data-wxplace="${esc(name)}">${i === 0 ? 'Heute' : WD[dt.getDay()]}<span class="ic">${ic}</span><b>${Math.round(w.daily.temperature_2m_max[i])}°</b>${Math.round(w.daily.temperature_2m_min[i])}°${rain != null ? `<div class="rain">${rain}%</div>` : ''}</div>`;
  }).join('')}</div>
  <h5 style="margin:12px 0 0;font-size:.85rem">${esc(fmtLong(w.daily.time[sel]))} – im Tagesverlauf</h5>
  ${periodsHTML(w, w.daily.time[sel])}`;
}
// Aufteilung eines Tages in Tageszeiten (aus den Stundenwerten)
const PERIODS = [['Nacht', 0, 6], ['Vormittag', 6, 12], ['Nachmittag', 12, 18], ['Abend', 18, 24]];
function periodsHTML(w, iso){
  if (!w || !w.hourly || !iso) return '';
  const h = w.hourly;
  const rows = PERIODS.map(([label, a, b]) => {
    const idx = [];
    h.time.forEach((t, i) => { if (t.startsWith(iso)) { const hr = +t.slice(11, 13); if (hr >= a && hr < b) idx.push(i); } });
    if (!idx.length) return '';
    const temps = idx.map(i => h.temperature_2m[i]);
    const code = Math.max(...idx.map(i => h.weather_code[i]));   // das «schlechteste» Wetter im Zeitraum
    const rain = h.precipitation_probability ? Math.max(...idx.map(i => h.precipitation_probability[i] ?? 0)) : null;
    const [ic, lb] = WMO(code, label === 'Nacht' ? 0 : 1);
    const lo = Math.round(Math.min(...temps)), hi = Math.round(Math.max(...temps));
    return `<div class="pr"><b>${label}</b><span class="ic">${ic}</span><span>${lo === hi ? lo : lo + '–' + hi}° · ${esc(lb)}</span><span class="rain">${rain != null ? '💧 ' + rain + '%' : ''}</span></div>`;
  }).join('');
  return rows ? `<div class="periods">${rows}</div>` : '';
}
function nowHTML(w){
  if (!w || !w.current) return '';
  const [ic, lb] = WMO(w.current.weather_code, w.current.is_day);
  return `<div class="wx-now"><span class="ic">${ic}</span><div><div class="t">${Math.round(w.current.temperature_2m)}°</div>
    <div class="hint">${esc(lb)} · Wind ${Math.round(w.current.wind_speed_10m)} km/h</div></div></div>`;
}
function renderWeather(){
  const main = $('#main');
  if (!state.days.length){ main.innerHTML = emptyState(); return; }
  const places = tripPlaces();
  const t = todayISO();
  const today = state.days.find(d => d.datum === t);
  const here = today && placeOf(today);
  const dated = state.days.filter(d => d.datum);
  const before = dated.length && t < dated[0].datum;
  const stand = wx.at ? new Date(wx.at).toLocaleString('de-CH', { weekday:'short', hour:'2-digit', minute:'2-digit' }) : 'noch nie';
  main.innerHTML = `
    <div class="toolbar" style="align-items:center">
      <div class="hint" style="flex:1">${wxBusy ? 'Wetter wird geladen …' : 'Stand: ' + esc(stand) + (navigator.onLine ? '' : ' · offline')}</div>
      <button class="btn secondary" id="wxRefresh" ${wxBusy ? 'disabled' : ''}>Aktualisieren</button>
    </div>
    ${here ? `<div class="card"><h2>Heute in ${esc(here.name)}</h2>${nowHTML(wx.data[here.name]) || '<p>Noch keine Daten – bitte «Aktualisieren».</p>'}${weekHTML(wx.data[here.name], here.name)}</div>` : ''}
    ${before ? `<p class="hint" style="margin:0 0 12px">Eine Prognose für eure Reisetage gibt es erst etwa 7 Tage vorher. Bis dahin siehst du hier das aktuelle Wetter an den Reiseorten. Ab dann erscheint das Wetter auch direkt bei jedem Tag im Plan.</p>` : ''}
    <div class="card"><h2>Orte der Reise</h2>
      ${places.map(p => { const w = wx.data[p.name]; const cur = w && w.current; const op = wxOpen.has(p.name);
        return `<div class="place" data-place="${esc(p.name)}"><div class="top"><div><div class="l"><b>${esc(p.name)}</b></div><div class="hint">${esc(fmtRange(p.days))}</div></div>
          <div class="cur">${cur ? WMO(cur.weather_code, cur.is_day)[0] + ' ' + Math.round(cur.temperature_2m) + '°' : '–'} <span class="hint">${op ? '▲' : '▼'}</span></div></div>
          ${op ? (w ? `<div style="margin-top:10px">${nowHTML(w)}${weekHTML(w, p.name)}</div>` : '<p class="hint">Noch keine Daten.</p>') : ''}</div>`; }).join('')}
      ${places.length ? '' : '<p>Keine Orte erkannt. Trage bei einem Tag unter «Bearbeiten» das Feld «Ort für Wetter» ein.</p>'}
    </div>
    <p class="hint" style="text-align:center">Wetterdaten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · Temperaturen in °C, 💧 = Regenrisiko</p>`;
  $('#wxRefresh').addEventListener('click', () => refreshWeather(true));
  main.querySelectorAll('[data-wxday]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); wxSel[el.dataset.wxplace] = +el.dataset.wxday; renderWeather();
  }));
  main.querySelectorAll('.place').forEach(el => el.addEventListener('click', (e) => {
    if (e.target.closest('.periods, a')) return;
    const n = el.dataset.place; wxOpen.has(n) ? wxOpen.delete(n) : wxOpen.add(n); renderWeather();
  }));
}

/* ---------- Sehenswürdigkeiten ---------- */
const SIGHT_COLS = ['Ort / Strecke', 'Name', 'Beschreibung', 'Link', 'Besucht'];
function importSights(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' , blankrows:false });
  const hi = rows.findIndex(r => r.some(c => /^name$/i.test(String(c).trim())));
  if (hi < 0) return [];
  const h = rows[hi].map(c => String(c).toLowerCase().trim());
  const col = (re) => h.findIndex(x => re.test(x));
  const cW = col(/^ort|strecke/), cN = col(/^name/), cB = col(/^beschr/), cL = col(/^link/), cV = col(/^besucht/);
  return rows.slice(hi+1).filter(r => clean(r[cN])).map(r => ({
    id:uid(), wo:clean(r[cW]), name:clean(r[cN]), info:cB >= 0 ? clean(r[cB]) : '',
    link:cL >= 0 ? clean(r[cL]) : '', besucht:cV >= 0 && /^(ja|x|yes|1|true)$/i.test(clean(r[cV]))
  }));
}
// bekannte Orte in einem Text, in der Reihenfolge ihres Vorkommens (ohne Mailand)
function placesIn(text){
  const hits = [];
  PLACES.forEach(p => { if (p[0] === 'Mailand') return; const m = new RegExp(p[3].source, 'i').exec(text); if (m) hits.push([m.index, p[0]]); });
  return hits.sort((a,b) => a[0] - b[0]).map(x => x[1]);
}
// Wo man übernachtet: Ort der Unterkunft, sonst Tagesort
function stayPlace(d){
  if (!d) return null;
  const p = PLACES.find(p => p[3].test(d.unterkunft || ''));
  if (p) return p[0];
  const q = placeOf(d); return q ? q.name : null;
}
// Autostrecke eines Tages, z.B. «Brisbane → Noosa» (nur an Tagen mit Fahrzeit oder km)
function routeOf(d){
  if (!(Number(d.km) > 0 || d.fahrzeit)) return null;
  const i = state.days.indexOf(d), prev = i > 0 ? state.days[i-1] : null;
  const text = String(d.was || '');
  const idx = text.search(/fahrt/i);
  let from = null, to = null;
  if (idx >= 0){
    const seg = text.slice(idx).split(/[\n(,]/)[0];
    const ps = placesIn(seg);
    if (ps.length >= 2){ from = ps[0]; to = ps[ps.length-1]; }
    else if (ps.length === 1){ to = ps[0]; const before = placesIn(text.slice(0, idx)); from = before.length ? before[before.length-1] : stayPlace(prev); }
  }
  if (!to){ from = stayPlace(prev); to = stayPlace(d); }
  if (!from || !to || from === to || from === 'Mailand' || to === 'Mailand') return null;
  return from + ' → ' + to;
}
function sightGroups(){
  const groups = [];
  const add = (key, type, d) => {
    let g = groups.find(x => x.key === key);
    if (!g){ g = { key, type, days:[], km:d.km, fz:d.fahrzeit }; groups.push(g); }
    if (d.datum && !g.days.includes(d.datum)) g.days.push(d.datum);
  };
  state.days.forEach(d => {
    const r = routeOf(d); if (r) add(r, 'route', d);
    const p = placeOf(d); if (p && p.name !== 'Mailand') add(p.name, 'place', d);
  });
  const known = new Set(groups.map(g => g.key));
  const others = [...new Set(state.sights.map(s => s.wo).filter(w => !known.has(w)))];
  others.forEach(w => groups.push({ key:w, type:'other', days:[] }));
  return groups;
}
function sightsForDay(d){
  if (!state.sights || !state.sights.length) return [];
  const p = placeOf(d), keys = [routeOf(d), p && p.name].filter(Boolean);
  return state.sights.filter(s => keys.includes(s.wo));
}
function groupTitle(g){
  if (g.type === 'route') return '🚗 Unterwegs: ' + g.key;
  if (g.type === 'other') return '📌 ' + (g.key || 'Ohne Zuordnung');
  return '📍 ' + g.key;
}
function groupSub(g){
  const parts = [fmtRange(g.days)];
  if (g.type === 'route'){ if (g.km) parts.push(g.km + ' km'); if (g.fz) parts.push(g.fz + ' h'); }
  return parts.filter(Boolean).join(' · ');
}
function mapsUrl(s){
  const where = s.wo && !s.wo.includes('→') ? ', ' + s.wo : '';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + where + ', Australia');
}
function sightHTML(s){
  return `<div class="sight${s.besucht ? ' done' : ''}">
    <button class="chk" data-toggle="${s.id}" aria-label="Besucht">${s.besucht ? '✓' : ''}</button>
    <div><div class="nm" data-edit="${s.id}">${esc(s.name)}</div>
      ${s.info ? `<div class="ds">${esc(s.info)}</div>` : ''}
      <div class="lk"><a href="${mapsUrl(s)}" target="_blank" rel="noopener">🗺 Karte</a>${s.link ? `<a href="${esc(/^https?:/i.test(s.link) ? s.link : 'https://' + s.link)}" target="_blank" rel="noopener">🔗 Link</a>` : ''}</div>
    </div></div>`;
}
function bindSightEvents(root, after){
  root.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const s = state.sights.find(x => x.id === b.dataset.toggle); if (!s) return;
    s.besucht = !s.besucht; save(); after();
  }));
  root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openSightEdit(b.dataset.edit)));
  root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => openSightEdit(null, b.dataset.add)));
}
function renderSights(){
  const main = $('#main');
  if (!state.days.length){ main.innerHTML = emptyState(); return; }
  const groups = sightGroups();
  const total = state.sights.length, done = state.sights.filter(s => s.besucht).length;
  main.innerHTML = `<div class="toolbar" style="align-items:center">
      <div class="hint" style="flex:1">${total ? done + ' von ' + total + ' besucht' : 'Noch keine Sehenswürdigkeiten erfasst.'}</div>
      <button class="btn" data-add="">+ Neu</button>
    </div>
    ${groups.map(g => {
      const items = state.sights.filter(s => s.wo === g.key);
      return `<div class="card grp"><h2><span>${esc(groupTitle(g))}</span><small>${esc(groupSub(g))}</small></h2>
        ${items.map(sightHTML).join('')}
        <button class="addlink" data-add="${esc(g.key)}">+ hinzufügen</button></div>`;
    }).join('')}`;
  bindSightEvents(main, renderSights);
}
function openSightEdit(id, presetWo){
  const s = id ? state.sights.find(x => x.id === id) : null;
  const groups = sightGroups().filter(g => g.type !== 'other');
  const wo = s ? s.wo : (presetWo || '');
  const isOther = wo && !groups.some(g => g.key === wo);
  $('#dlgTitle').textContent = s ? 'Sehenswürdigkeit bearbeiten' : 'Neue Sehenswürdigkeit';
  $('#dlgBody').innerHTML = `
    <div class="field"><label for="s_name">Name</label><input id="s_name" value="${esc(s ? s.name : '')}" placeholder="z.B. Hell's Gates"></div>
    <div class="field"><label for="s_wo">Wo?</label><select id="s_wo">
      <option value="">– bitte wählen –</option>
      ${groups.map(g => `<option value="${esc(g.key)}" ${g.key === wo ? 'selected' : ''}>${esc((g.type === 'route' ? '🚗 Unterwegs: ' : '📍 ') + g.key + (g.days.length ? ' (' + fmtRange(g.days) + ')' : ''))}</option>`).join('')}
      <option value="__other" ${isOther ? 'selected' : ''}>Anderer Ort / andere Strecke …</option>
    </select></div>
    <div class="field ${isOther ? '' : 'hidden'}" id="s_otherBox"><label for="s_other">Eigene Angabe</label><input id="s_other" value="${esc(isOther ? wo : '')}" placeholder="z.B. Rainbow Beach"></div>
    <div class="field"><label for="s_info">Beschreibung / Tipps</label><textarea id="s_info">${esc(s ? s.info : '')}</textarea></div>
    <div class="field"><label for="s_link">Link (optional)</label><input id="s_link" type="url" inputmode="url" value="${esc(s ? s.link : '')}" placeholder="https://…"></div>
    <div class="field check"><input type="checkbox" id="s_done" ${s && s.besucht ? 'checked' : ''}><label for="s_done" style="margin:0">Schon besucht</label></div>
    <div class="actions">${s ? '<button class="btn danger" id="sDel">Löschen</button>' : '<button class="btn secondary" data-close>Abbrechen</button>'}<button class="btn" id="sSave">Speichern</button></div>`;
  $('#s_wo').addEventListener('change', (e) => $('#s_otherBox').classList.toggle('hidden', e.target.value !== '__other'));
  $('#sSave').addEventListener('click', () => {
    const name = $('#s_name').value.trim();
    let w = $('#s_wo').value; if (w === '__other') w = $('#s_other').value.trim();
    if (!name){ toast('Bitte einen Namen eingeben'); return; }
    if (!w){ toast('Bitte angeben, wo die Sehenswürdigkeit liegt'); return; }
    const t = s || { id:uid() };
    Object.assign(t, { name, wo:w, info:$('#s_info').value.trim(), link:$('#s_link').value.trim(), besucht:$('#s_done').checked });
    if (!s) state.sights.push(t);
    save(); $('#dlg').close(); render(); toast('Gespeichert');
  });
  if (s) $('#sDel').addEventListener('click', (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Wirklich?'; return; }
    state.sights = state.sights.filter(x => x !== s); save(); $('#dlg').close(); render(); toast('Gelöscht');
  });
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
}

/* ---------- Detail & Bearbeiten ---------- */
function openDetail(id){
  const d = state.days.find(x => x.id === id); if (!d) return;
  $('#dlgTitle').textContent = fmtLong(d.datum);
  const rows = FIELDS.filter(([k]) => k !== 'datum' && d[k]).map(([k,label]) => {
    let v = d[k]; if (k==='fahrzeit') v += ' h'; if (k==='km') v += ' km'; if (k==='besuch') v += ' h';
    return `<dt>${esc(label)}</dt><dd>${['was','bemerkungen','zusatz','pendenzen','notizen'].includes(k) ? richText(v, true) : esc(v)}</dd>`;
  }).join('');
  const flHint = flightsOf(d).length ? '<p class="hint" style="margin-top:14px">✈ «Status» zeigt live Abflugzeit, Verspätung, Terminal und Gate (Gate meist erst 1–2 h vor Abflug). «Radar» zeigt, wo das Flugzeug gerade ist.</p>' : '';
  const pl = placeOf(d), fc = forecastFor(d);
  const wxBox = fc ? `<div class="card" style="background:#EEF3F7;margin:0 0 6px"><b>${fc.icon} Wetter in ${esc(pl.name)}</b>
      <div style="margin-top:4px">${esc(fc.label)} · ${fc.max}° / ${fc.min}°${fc.rain != null ? ' · Regenrisiko ' + fc.rain + '%' : ''}</div>
      ${periodsHTML(wx.data[pl.name], d.datum)}</div>` : '';
  const route = routeOf(d), sights = sightsForDay(d);
  const sightBox = (pl || route) ? `<div style="margin-top:16px"><dt style="font-size:.78rem;font-weight:600;color:var(--muted)">Sehenswürdigkeiten${route ? ' (inkl. unterwegs ' + esc(route) + ')' : ''}</dt>
      ${sights.map(sightHTML).join('') || '<p class="hint" style="margin:4px 0">Noch keine erfasst.</p>'}
      <button class="addlink" data-add="${esc(pl && pl.name !== 'Mailand' ? pl.name : route || '')}">+ Sehenswürdigkeit</button></div>` : '';
  $('#dlgBody').innerHTML = `${wxBox}<dl class="detail">${rows || '<p class="hint">Keine Angaben.</p>'}</dl>${flHint}${sightBox}
    ${d.unterkunft ? `<p style="margin-top:14px"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.unterkunft.replace(/\(.*?\)/g,'') + ' Australia')}" target="_blank" rel="noopener">📍 Unterkunft in Google Maps öffnen</a></p>` : ''}
    <div class="actions"><button class="btn secondary" data-close>Schliessen</button><button class="btn" id="editBtn">Bearbeiten</button></div>`;
  $('#editBtn').addEventListener('click', () => openEdit(id));
  bindSightEvents($('#dlgBody'), () => { openDetail(id); render(); });
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
}
function openEdit(id){
  const d = id ? state.days.find(x => x.id === id) : null;
  const v = (k) => esc(d ? d[k] : '');
  const long = new Set(['was','bemerkungen','zusatz','pendenzen','notizen']);
  $('#dlgTitle').textContent = d ? 'Tag bearbeiten' : 'Neuer Tag';
  const f = (k,label,type) => `<div class="field"><label for="f_${k}">${esc(label)}</label>${
    long.has(k) ? `<textarea id="f_${k}">${v(k)}</textarea>` : `<input id="f_${k}" type="${type||'text'}" value="${v(k)}"${k==='km'||k==='besuch'?' inputmode="decimal"':''}>`}</div>`;
  const L = Object.fromEntries(FIELDS.map(([k,l]) => [k,l]));
  $('#dlgBody').innerHTML = `
    <div class="grid2">${f('datum',L.datum,'date')}${f('status',L.status)}</div>
    ${f('was',L.was)}
    <div class="grid2">${f('fahrzeit',L.fahrzeit)}${f('km',L.km)}</div>
    <div class="grid2">${f('besuch',L.besuch)}${f('mietauto',L.mietauto)}</div>
    ${f('unterkunft',L.unterkunft)}${f('fruehstueck',L.fruehstueck)}
    ${f('bemerkungen',L.bemerkungen)}${f('pendenzen',L.pendenzen)}${f('zusatz',L.zusatz)}${f('notizen',L.notizen)}${f('ort',L.ort)}
    <div class="actions">${d ? '<button class="btn danger" id="delBtn">Löschen</button>' : '<button class="btn secondary" data-close>Abbrechen</button>'}<button class="btn" id="saveBtn">Speichern</button></div>`;
  $('#saveBtn').addEventListener('click', () => {
    const t = d || { id:uid() };
    FIELDS.forEach(([k]) => { t[k] = $('#f_'+k).value.trim(); });
    if (!t.datum){ toast('Bitte ein Datum angeben'); return; }
    if (!d) state.days.push(t);
    sortDays(); save(); render(); openDetail(t.id); toast('Gespeichert');
    if (t.ort && !wx.data[t.ort]) refreshWeather(true);
  });
  if (d) $('#delBtn').addEventListener('click', (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Wirklich?'; return; }
    state.days = state.days.filter(x => x !== d); save(); $('#dlg').close(); render(); toast('Tag gelöscht');
  });
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
}

/* ---------- Allgemein ---------- */
document.addEventListener('click', (e) => { const c = e.target.closest('[data-close]'); if (c) c.closest('dialog').close(); });
document.querySelectorAll('dialog').forEach(dl => dl.addEventListener('click', (e) => { if (e.target === dl) dl.close(); }));
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); if (tab === 'wetter') refreshWeather(false); }));
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (tab==='daten') renderData(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden){ render(); refreshWeather(false); } });
window.addEventListener('online', () => refreshWeather(false));

render();
if (tab === 'plan') setTimeout(scrollToday, 50);
refreshWeather(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
